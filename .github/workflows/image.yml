name: Container image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: life_planner
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: life_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life_planner -d life_planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://life_planner:test_password@localhost:5432/life_planner_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run type:check
      - run: bun run lint
      - run: bun run test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/billyhawkes/life-planner:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/billyhawkes/life-planner
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deployment image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "LIFE_PLANNER_IMAGE=ghcr.io/billyhawkes/life-planner@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
